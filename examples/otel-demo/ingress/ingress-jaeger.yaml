apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: jaeger-demo-ingress
  namespace: jaeger
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
spec:
  ingressClassName: nginx
  rules:
    - host: jaeger.demo.jaegertracing.io
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: jaeger-query-clusterip
                port:
                  number: 16686
    - host: hotrod.demo.jaegertracing.io
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: jaeger-hotrod
                port:
                  number: 80
  tls:
    - hosts:
        - jaeger.demo.jaegertracing.io
        - hotrod.demo.jaegertracing.io
      secretName: jaeger-demo-tls
---
# Keep chat limits separate from the UI, REST API, HotROD, and MCP callbacks.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: jaeger-demo-ai-ingress
  namespace: jaeger
  annotations:
    nginx.ingress.kubernetes.io/limit-rpm: "10"
    nginx.ingress.kubernetes.io/limit-connections: "2"
    nginx.ingress.kubernetes.io/limit-burst-multiplier: "1"
    nginx.ingress.kubernetes.io/proxy-buffering: "off"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "180"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "180"
spec:
  ingressClassName: nginx
  rules:
    - host: jaeger.demo.jaegertracing.io
      http:
        paths:
          - path: /api/ai/chat
            pathType: Exact
            backend:
              service:
                name: jaeger-query-clusterip
                port:
                  number: 16686
  tls:
    - hosts:
        - jaeger.demo.jaegertracing.io
      secretName: jaeger-demo-tls
