global:
  imageRegistry: docker.io

allInOne:
  enabled: true
  extraEnv: []
  resources:
    requests:
      memory: "1Gi"
    limits:
      memory: "3Gi"
  affinity:
    podAntiAffinity:
      preferredDuringSchedulingIgnoredDuringExecution:
        - weight: 100
          podAffinityTerm:
            topologyKey: kubernetes.io/hostname
            namespaces:
              - opensearch
            labelSelector:
              matchLabels:
                app.kubernetes.io/instance: opensearch
                app.kubernetes.io/name: opensearch


# Enable HotROD demo application
hotrod:
  enabled: true
  image:
    tag: "1.72.0"
  args:
    - all
  extraArgs:
    - --jaeger-ui=https://jaeger.demo.jaegertracing.io
    - --otel-exporter=otlp
  livenessProbe:
    path: /
  readinessProbe:
    path: /
  extraEnv:
    - name: OTEL_EXPORTER_OTLP_ENDPOINT
      value: http://jaeger-collector:4318
    - name: OTEL_EXPORTER_OTLP_TRACES_ENDPOINT
      value: http://jaeger-collector:4318/v1/traces
    - name: OTEL_EXPORTER_OTLP_PROTOCOL
      value: http/protobuf
    - name: OTEL_SERVICE_NAME
      value: hotrod
    - name: OTEL_LOG_LEVEL
      value: debug


query:
  service:
    type: ClusterIP

# Daily retention for the OpenSearch indices Jaeger writes (see index_prefix and
# date_layout in jaeger-config.yaml). Without it the daily indices accumulate
# until the data volume breaches the flood-stage watermark and OpenSearch makes
# them read-only, which stops all trace ingestion.
esIndexCleaner:
  enabled: true
  numberOfDays: 30
  image:
    # The chart defaults to its appVersion, which is not a published tag.
    tag: "2.21.0"
  cmdlineParams:
    # The cleaner matches "<prefix>jaeger-span-<date>", so the trailing dash is
    # required. The chart's ES_INDEX_PREFIX env var is not read by the cleaner.
    index-prefix: "jaeger-main-"
  resources:
    requests:
      cpu: "50m"
      memory: "64Mi"
    limits:
      memory: "128Mi"
