global:
  imageRegistry: docker.io

allInOne:
  enabled: true
  extraEnv: []
  resources:
    requests:
      memory: "1Gi"
    limits:
      memory: "3Gi"
  affinity:
    podAntiAffinity:
      preferredDuringSchedulingIgnoredDuringExecution:
        - weight: 100
          podAffinityTerm:
            topologyKey: kubernetes.io/hostname
            namespaces:
              - opensearch
            labelSelector:
              matchLabels:
                app.kubernetes.io/instance: opensearch
                app.kubernetes.io/name: opensearch


# Enable HotROD demo application
hotrod:
  enabled: true
  image:
    tag: "1.72.0"
  args:
    - all
  extraArgs:
    - --jaeger-ui=https://jaeger.demo.jaegertracing.io
    - --otel-exporter=otlp
  livenessProbe:
    path: /
  readinessProbe:
    path: /
  extraEnv:
    - name: OTEL_EXPORTER_OTLP_ENDPOINT
      value: http://jaeger-collector:4318
    - name: OTEL_EXPORTER_OTLP_TRACES_ENDPOINT
      value: http://jaeger-collector:4318/v1/traces
    - name: OTEL_EXPORTER_OTLP_PROTOCOL
      value: http/protobuf
    - name: OTEL_SERVICE_NAME
      value: hotrod
    - name: OTEL_LOG_LEVEL
      value: debug


query:
  service:
    type: ClusterIP
