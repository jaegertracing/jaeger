global:
  imageRegistry: docker.io

allInOne:
  enabled: true
  extraEnv:
    - name: GOOSE_SERVER__SECRET_KEY
      valueFrom:
        secretKeyRef:
          name: jaeger-demo-ai
          key: GOOSE_SERVER__SECRET_KEY
  resources:
    requests:
      memory: "1Gi"
    limits:
      memory: "3Gi"
  affinity:
    podAntiAffinity:
      preferredDuringSchedulingIgnoredDuringExecution:
        - weight: 100
          podAffinityTerm:
            topologyKey: kubernetes.io/hostname
            namespaces:
              - opensearch
            labelSelector:
              matchLabels:
                app.kubernetes.io/instance: opensearch
                app.kubernetes.io/name: opensearch


# Enable HotROD demo application
hotrod:
  enabled: true
  image:
    tag: "1.72.0"
  args:
    - all
  extraArgs:
    - --jaeger-ui=https://jaeger.demo.jaegertracing.io
    - --otel-exporter=otlp
  livenessProbe:
    path: /
  readinessProbe:
    path: /
  extraEnv:
    - name: OTEL_EXPORTER_OTLP_ENDPOINT
      value: http://jaeger-collector:4318
    - name: OTEL_EXPORTER_OTLP_TRACES_ENDPOINT
      value: http://jaeger-collector:4318/v1/traces
    - name: OTEL_EXPORTER_OTLP_PROTOCOL
      value: http/protobuf
    - name: OTEL_SERVICE_NAME
      value: hotrod
    - name: OTEL_LOG_LEVEL
      value: debug


query:
  service:
    type: ClusterIP

# Daily retention for the OpenSearch indices Jaeger writes (see index_prefix and
# date_layout in jaeger-config.yaml). Without it the daily indices accumulate
# until the data volume breaches the flood-stage watermark and OpenSearch makes
# them read-only, which stops all trace ingestion.
esIndexCleaner:
  enabled: true
  numberOfDays: 30
  image:
    # The chart defaults to its appVersion, which is not a published tag.
    repository: jaegertracing/jaeger-es-index-cleaner
    tag: "2.21.0@sha256:b279c63cf645acd536ee2bd578797e7226988e818aca7e0988dda4dc96c90858"
  cmdlineParams:
    # Pinned 2.21.0 appends "-" to every nonempty prefix, then matches
    # "<prefix>jaeger-(span|service|dependencies|sampling)-<date>". Set this
    # to the same index_prefix jaeger-config.yaml writes ("jaeger-main"),
    # which becomes jaeger-main-jaeger-span-<date>. The chart's
    # ES_INDEX_PREFIX env var is not read by the cleaner.
    index-prefix: "jaeger-main"
  resources:
    requests:
      cpu: "50m"
      memory: "64Mi"
    limits:
      memory: "128Mi"

# Build scripts/ai-sidecar/goose/Dockerfile and publish it before deployment.
# Keep the image digest here so a redeploy uses the same agent and extension list.
goose:
  image: ""

extraObjects:
  - apiVersion: apps/v1
    kind: Deployment
    metadata:
      name: jaeger-goose
    spec:
      replicas: 1
      selector:
        matchLabels:
          app.kubernetes.io/name: jaeger-goose
      template:
        metadata:
          labels:
            app.kubernetes.io/name: jaeger-goose
        spec:
          automountServiceAccountToken: false
          securityContext:
            runAsNonRoot: true
            runAsUser: 10001
            runAsGroup: 10001
            fsGroup: 10001
          initContainers:
            - name: goose-config
              image: '{{ required "Set goose.image" .Values.goose.image }}'
              command: [sh, -ec]
              args:
                - mkdir -p /runtime/.config; cp -R /tmp/.config/goose /runtime/.config/
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities:
                  drop: [ALL]
              volumeMounts:
                - name: runtime
                  mountPath: /runtime
          containers:
            - name: goose
              image: '{{ required "Set goose.image" .Values.goose.image }}'
              imagePullPolicy: IfNotPresent
              env:
                - name: GOOSE_PROVIDER
                  value: openai
                - name: GOOSE_MODEL
                  value: gpt-6-luna
                - name: GOOSE_THINKING_EFFORT
                  value: "off"
                - name: GOOSE_MAX_TURNS
                  value: "8"
                - name: GOOSE_MAX_TOKENS
                  value: "4096"
                - name: GOOSE_DISABLE_SESSION_NAMING
                  value: "true"
                - name: OPENAI_STORE
                  value: "false"
                - name: OPENAI_API_KEY
                  valueFrom:
                    secretKeyRef:
                      name: jaeger-demo-ai
                      key: OPENAI_API_KEY
                - name: GOOSE_SERVER__SECRET_KEY
                  valueFrom:
                    secretKeyRef:
                      name: jaeger-demo-ai
                      key: GOOSE_SERVER__SECRET_KEY
              ports:
                - name: acp
                  containerPort: 16688
              readinessProbe:
                tcpSocket:
                  port: acp
                periodSeconds: 5
              resources:
                requests:
                  cpu: 100m
                  memory: 256Mi
                limits:
                  cpu: "1"
                  memory: 1Gi
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities:
                  drop: [ALL]
              volumeMounts:
                - name: runtime
                  mountPath: /tmp
          volumes:
            - name: runtime
              emptyDir:
                sizeLimit: 256Mi
  - apiVersion: v1
    kind: Service
    metadata:
      name: jaeger-goose
    spec:
      type: ClusterIP
      selector:
        app.kubernetes.io/name: jaeger-goose
      ports:
        - name: acp
          port: 16688
          targetPort: acp
  - apiVersion: networking.k8s.io/v1
    kind: NetworkPolicy
    metadata:
      name: jaeger-goose
    spec:
      podSelector:
        matchLabels:
          app.kubernetes.io/name: jaeger-goose
      policyTypes: [Ingress]
      ingress:
        - from:
            - podSelector:
                matchLabels:
                  app.kubernetes.io/instance: '{{ .Release.Name }}'
                  app.kubernetes.io/component: all-in-one
          ports:
            - protocol: TCP
              port: 16688
