apiVersion: apps/v1
kind: Deployment
metadata:
  name: trace-generator
spec:
  replicas: 1
  selector:
    matchLabels:
      app: trace-generator
  template:
    metadata:
      labels:
        app: trace-generator
    spec:
      containers:
      - name: trace-generator
        image: python:3.11.14@sha256:3b3706a90cb23f04fabb0d255824f9a70ceb46177041898133dd5a35f3a50f0a
        command:
          - /bin/sh
          - -c
          - |
            pip install --no-cache-dir -r /app/requirements.txt && python /app/generate_traces.py
        volumeMounts:
        - name: script-volume
          mountPath: /app
      restartPolicy: Always
      volumes:
      - name: script-volume
        configMap:
          name: trace-script
