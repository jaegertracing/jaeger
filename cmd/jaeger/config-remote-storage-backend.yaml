service:
  extensions: [jaeger_storage, remote_storage, healthcheckv2]
  pipelines:
    traces:
      receivers: [otlp]
      processors: []
      exporters: [jaeger_storage_exporter]
  telemetry:
    resource:
      service.name: jaeger
    metrics:
      level: detailed
      readers:
        - pull:
            exporter:
              prometheus:
                host: 0.0.0.0
                port: 8887
    logs:
      level: debug
    # TODO Initialize telemetry tracer once OTEL released new feature.
    # https://github.com/open-telemetry/opentelemetry-collector/issues/10663

extensions:
  healthcheckv2:
    use_v2: true
    http:
      # use different port to avoid conflict with collector on 13133
      endpoint: 0.0.0.0:12133

  jaeger_storage:
    backends:
      memory-storage:
        memory:
          max_traces: 100000
  remote_storage:
    endpoint: localhost:17271
    storage: memory-storage

receivers:
  otlp:
    protocols:
      grpc:
        endpoint: "${env:REMOTE_STORAGE_BACKEND_GRPC_ENDPOINT:-0.0.0.0:4317}"

processors:

exporters:
  jaeger_storage_exporter:
    trace_storage: memory-storage
    queue:
      enabled: true
      sizer: requests
      num_consumers: 1
      queue_size: 10
      block_on_overflow: true
      wait_for_result: false
      batch:
        enabled: true
        sizer: items
        min_size: 8192
        max_size: 0
        flush_timeout: 200ms
