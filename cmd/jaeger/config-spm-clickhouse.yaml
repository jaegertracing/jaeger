service:
  extensions: [jaeger_storage, jaeger_query]
  pipelines:
    traces:
      receivers: [otlp]
      processors: []
      exporters: [jaeger_storage_exporter]

extensions:
  jaeger_query:
    storage:
      traces: clickhouse_storage
      metrics: clickhouse_storage
  jaeger_storage:
    backends:
      clickhouse_storage: &clickhouse_config
        clickhouse:
          addresses:
            - clickhouse:9000
          database: jaeger
          auth:
            basic:
              username: default
              password: password
          create_schema: true
          table_engine:
            merge_tree: {}
    metric_backends:
      clickhouse_storage: *clickhouse_config

receivers:
  otlp:
    protocols:
      grpc:
      http:
        endpoint: "0.0.0.0:4318"

processors:

exporters:
  jaeger_storage_exporter:
    trace_storage: clickhouse_storage
    queue:
      enabled: true
      sizer: requests
      num_consumers: 1
      queue_size: 10
      block_on_overflow: true
      wait_for_result: false
      batch:
        enabled: true
        sizer: items
        min_size: 8192
        max_size: 0
        flush_timeout: 200ms
