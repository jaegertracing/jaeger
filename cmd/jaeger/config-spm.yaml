service:
  extensions: [jaeger_storage, jaeger_query]
  pipelines:
    traces:
      receivers: [otlp]
      processors: [queue_batch]
      exporters: [jaeger_storage_exporter, spanmetrics]
    metrics/spanmetrics:
      receivers: [spanmetrics]
      exporters: [prometheus]
  telemetry:
    resource:
      service.name: jaeger
    metrics:
      level: detailed
      readers:
        - pull:
            exporter:
              prometheus:
                host: 0.0.0.0
                port: 8888
    logs:
      level: DEBUG

extensions:
  jaeger_query:
    storage:
      traces: some_storage
      metrics: some_metrics_storage
  jaeger_storage:
    backends:
      some_storage:
        memory:
          max_traces: 100000
    metric_backends:
      some_metrics_storage:
        prometheus:
          endpoint: http://prometheus:9090
          normalize_calls: true
          normalize_duration: true
          # extra_dimensions declares the pre-configured set of additional
          # Prometheus labels the SPM API can filter on. Names must match the
          # `dimensions:` declared in the spanmetrics connector below, so the
          # labels exist on the stored time series. Attributes discarded during
          # aggregation cannot be recovered by a metrics query.
          # Stored labels must use underscore translation: the dimension
          # deployment.environment is queried as deployment_environment.
          # Pipelines preserving dotted label names are not supported.
          # See docs/rfc/0021-spm-dimension-filtering.md for the proposal.
          # extra_dimensions:
          #   - name: deployment.environment
          #     display_name: Environment
          #     values: [prod, staging, dev]

connectors:
  spanmetrics:
    metrics_flush_interval: ${env:SPANMETRICS_FLUSH_INTERVAL:-60s}

receivers:
  otlp:
    protocols:
      grpc:
      http:
        endpoint: "0.0.0.0:4318"

processors:
  queue_batch:
    sizer: requests
    num_consumers: 1
    queue_size: 8192
    block_on_overflow: true
    wait_for_result: false
    batch:
      enabled: true
      sizer: items
      min_size: 8192
      max_size: 0
      flush_timeout: 200ms

exporters:
  jaeger_storage_exporter:
    trace_storage: some_storage
    queue:
      enabled: false
  prometheus:
    endpoint: "0.0.0.0:8889"
    # Dimension filtering requires underscore-translated labels, for example:
    # translation_strategy: UnderscoreEscapingWithSuffixes
