service:
  extensions: [jaeger_storage, jaeger_query, healthcheckv2]
  pipelines:
    traces:
      receivers: [otlp]
      processors: [batch]
      exporters: [jaeger_storage_exporter]
  telemetry:
    resource:
      service.name: jaeger
    metrics:
      level: detailed
      readers:
        - pull:
            exporter:
              prometheus:
                host: 0.0.0.0
                port: 8888
    logs:
      level: debug
    # TODO Initialize telemetry tracer once OTEL released new feature.
    # https://github.com/open-telemetry/opentelemetry-collector/issues/10663

extensions:
  healthcheckv2:
    use_v2: true
    http:

  jaeger_query:
    storage:
      traces: some_storage
      metrics: some_storage
      traces_archive: another_storage
    ui:
      config_file: ./cmd/jaeger/config-ui.json

  jaeger_storage:
    backends:
      some_storage: &opensearch_config
        opensearch:
          server_urls:
            - http://localhost:9200
          # custom_headers:
          #   Host: "my-opensearch-domain.us-east-1.es.amazonaws.com"
          #   X-Custom-Header: "custom-value"
          # Sort a span search on the document _id after the ordering terms, so that paging
          # returns every stored occurrence of a span. It is off by default because the sort
          # builds _id field data on the heap; this file turns it on so that the OpenSearch
          # e2e suite exercises that path, which OpenSearch allows without a cluster setting.
          span_search_tie_break_by_id: true
          indices:
            index_prefix: "jaeger-main"
            spans:
              date_layout: "2006-01-02"
              rollover_frequency: "day"
              shards: 5
              replicas: 1
              # Index attribute values as numbers beside the keyword, so that a structured
              # filter can order on an attribute (RFC 0015). Applies to indices created after
              # it is turned on. The e2e tests read it from the environment.
              numeric_attributes: ${env:ES_NUMERIC_ATTRIBUTES:-true}
            services:
              date_layout: "2006-01-02"
              rollover_frequency: "day"
              shards: 5
              replicas: 1
            dependencies:
              date_layout: "2006-01-02"
              rollover_frequency: "day"
              shards: 5
              replicas: 1
            sampling:
              date_layout: "2006-01-02"
              rollover_frequency: "day"
              shards: 5
              replicas: 1
      another_storage:
        opensearch:
          server_urls:
            - http://localhost:9200
          indices:
            index_prefix: "jaeger-archive"

    # Optional, enable metrics backend to use Monitor tab
    metric_backends:
      some_storage: *opensearch_config

receivers:
  otlp:
    protocols:
      grpc:
      http:
        endpoint: "0.0.0.0:4318"

processors:
  batch:

exporters:
  jaeger_storage_exporter:
    trace_storage: some_storage
