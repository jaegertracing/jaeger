# At-least-once Kafka ingester with synchronous Elasticsearch writes (RFC 0007).
#
# This is the ingester half of a Collector -> Kafka -> Ingester -> Elasticsearch
# pipeline configured so a Kafka offset is committed only after the spans it
# covers are durably written:
#
#   1. elasticsearch.write_mode: sync — each batch is one blocking _bulk request,
#      so a write failure is surfaced to the pipeline instead of being swallowed by
#      the async bulk buffer.
#   2. elasticsearch.poison_pill_handling: drop — a document the backend rejects
#      terminally (a malformed/poison span) is discarded rather than failing the
#      batch forever, so a bad span can never stall the partition. Transient
#      failures still fail the batch and are retried. (This is what makes sync mode
#      safe to run without the dead-letter path — RFC 0007 §4.8.)
#   3. The storage exporter blocks on the write result (queue.wait_for_result) and
#      batches inside its sending queue, so there is NO pipeline `batch` processor.
#   4. The Kafka receiver marks offsets only after successful processing
#      (message_marking.after: true, on_error: false).
#   5. The storage exporter retries a failed write until it succeeds
#      (retry_on_failure with max_elapsed_time: 0). Without it a single transient
#      failure reaches the receiver, which pauses the partition until a rebalance;
#      with one ingester replica that rebalance never comes and the partition
#      stalls for good.

service:
  extensions: [jaeger_storage, jaeger_query, healthcheckv2]
  pipelines:
    traces:
      receivers: [kafka]
      # No `batch` processor: batching happens in the exporter's sending queue so
      # the Kafka offset stays coupled to the write result.
      processors: []
      exporters: [jaeger_storage_exporter]
  telemetry:
    resource:
      service.name: jaeger_ingester
    metrics:
      level: detailed
      readers:
        - pull:
            exporter:
              prometheus:
                host: 0.0.0.0
                # use different port to avoid conflict with the collector
                port: 8889
    logs:
      level: info

extensions:
  healthcheckv2:
    use_v2: true
    http:
      # use different port to avoid conflict with the collector
      endpoint: 0.0.0.0:14133

  jaeger_query:
    storage:
      traces: some_storage

  jaeger_storage:
    backends:
      some_storage:
        elasticsearch:
          server_urls:
            # The e2e fault-injection test points this at a proxy it controls.
            - ${env:ES_SERVER_URL:-http://localhost:9200}
          # Write each batch with one blocking _bulk request (RFC 0007).
          write_mode: sync
          # Drop poison spans so a malformed document can't stall the partition.
          poison_pill_handling: drop
          bulk_processing:
            # Per-request byte cap of the synchronous writer, measured on the NDJSON
            # _bulk body, which is 1.3x to 3.6x the batch's protobuf size that
            # queue.batch.max_size below is measured in. Keep max_size at most half of
            # this so a batch is one _bulk request in the common case (see #PRNUM).
            max_bytes: 10000000
          indices:
            index_prefix: "jaeger-main"

receivers:
  kafka:
    brokers:
      - ${env:KAFKA_BROKER:-localhost:9092}
    traces:
      topics:
        - ${env:KAFKA_TOPIC:-jaeger-spans}
      encoding: ${env:KAFKA_ENCODING:-otlp_proto}
    initial_offset: earliest
    # Commit an offset only after the spans it covers are durably written.
    message_marking:
      after: true
      on_error: false

processors:

exporters:
  jaeger_storage_exporter:
    trace_storage: some_storage
    # Retry a failed batch until the backend accepts it. The write is idempotent
    # (deterministic span _id), so a retry after a lost acknowledgement upserts
    # rather than duplicates. max_elapsed_time: 0 disables the give-up deadline:
    # giving up returns the error to the Kafka receiver, which then pauses the
    # partition until a rebalance, so the offset must instead be held by retrying.
    retry_on_failure:
      enabled: true
      initial_interval: 1s
      max_interval: 30s
      max_elapsed_time: 0
    # Block the receiver on the write result and batch inside the queue, replacing
    # the pipeline `batch` processor. Sizes are in bytes to stay comparable with the
    # storage's bulk_processing.max_bytes.
    queue:
      wait_for_result: true
      # A full queue waits for room instead of failing the record: the failure
      # would otherwise reach the receiver before any retry and pause the partition.
      block_on_overflow: true
      sizer: bytes
      num_consumers: 1
      queue_size: 104857600 # 100 MiB of buffered spans
      batch:
        sizer: bytes
        flush_timeout: 200ms
        # min_size must be positive: at 0 the batcher flushes every record as it
        # arrives and merges nothing. Below 1 MiB the batch waits for flush_timeout.
        min_size: 1048576
        max_size: 4194304 # 4 MiB, at most half of bulk_processing.max_bytes above
