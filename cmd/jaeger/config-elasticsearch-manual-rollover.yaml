# Config for e2e testing the manual_rollover rotation strategy.
# Uses a unique index_prefix to avoid collision with other tests.

service:
  extensions: [jaeger_storage, jaeger_query, healthcheckv2]
  pipelines:
    traces:
      receivers: [otlp]
      processors: []
      exporters: [jaeger_storage_exporter]
  telemetry:
    resource:
      service.name: jaeger
    metrics:
      level: detailed
      readers:
        - pull:
            exporter:
              prometheus:
                host: 0.0.0.0
                port: 8888
    logs:
      level: debug

extensions:
  healthcheckv2:
    use_v2: true
    http:

  jaeger_query:
    storage:
      traces: some_storage
    ui:
      config_file: ./cmd/jaeger/config-ui.json

  jaeger_storage:
    backends:
      some_storage:
        elasticsearch:
          server_urls:
            - http://localhost:9200
          indices:
            index_prefix: "jaeger-mr"
            spans:
              shards: 1
              replicas: 0
              rotation:
                manual_rollover: {}
            services:
              shards: 1
              replicas: 0
              rotation:
                manual_rollover: {}
            dependencies:
              shards: 1
              replicas: 0
              rotation:
                manual_rollover: {}
            sampling:
              shards: 1
              replicas: 0
              rotation:
                manual_rollover: {}

receivers:
  otlp:
    protocols:
      grpc:
      http:
        endpoint: "0.0.0.0:4318"

processors:

exporters:
  jaeger_storage_exporter:
    trace_storage: some_storage
    queue:
      enabled: true
      sizer: requests
      num_consumers: 1
      queue_size: 10
      block_on_overflow: true
      wait_for_result: false
      batch:
        enabled: true
        sizer: items
        min_size: 8192
        max_size: 0
        flush_timeout: 200ms
