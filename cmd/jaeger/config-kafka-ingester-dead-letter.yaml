# At-least-once Kafka ingester with synchronous Elasticsearch writes and a
# dead-letter pipeline for poison spans (RFC 0007 §4.8).
#
# This is config-kafka-ingester-sync.yaml with these changes: jaeger_storage_exporter
# is declared under connectors instead of exporters, which gives it an output
# pipeline for the spans the storage rejects; the storage runs with
# poison_pill_handling: fail instead of drop; and a
# traces/dead_letter pipeline feeds an otlphttp exporter. A span the backend
# rejects terminally (a "poison pill": a document that fails identically on every
# retry, such as a mapping conflict) is then re-emitted onto the traces/dead_letter
# pipeline instead of being discarded, and the batch completes so the Kafka offset
# advances. The dead-letter sink is any standard exporter; this file uses otlphttp,
# and a kafka exporter writing to a dead-letter topic is the other common choice.
#
# The connector carries the same queue and retry_on_failure settings as the
# exporter, so the offset stays coupled to durability exactly as in the sync config:
# the receiver blocks on the write result (queue.wait_for_result), batching happens
# in the connector's sending queue (no pipeline `batch` processor), offsets are marked
# after processing (message_marking.after: true), and a transient write failure is
# retried until it succeeds.
#
# The dead-letter exporter must report its verdict synchronously, so its own
# sending_queue is disabled: with the queue on, the exporter would acknowledge a
# span as soon as it was enqueued, and the connector would advance the offset over a
# span the sink had not yet accepted. Its retries keep a short sink outage from
# failing the batch; once they are exhausted the connector returns the error, the
# offset holds, and the whole batch is retried (idempotently) with the poison. The
# Kafka e2e suite exercises an outage shorter than these retries; a sink that
# returns an error to the connector is covered by the connector's unit tests.
#
# The sink must also refuse what it does not keep. otlphttp treats an OTLP
# partial_success response (HTTP 200 with rejected_spans > 0) as success, so a
# dead-letter endpoint that drops spans that way loses them silently; point it at
# a receiver that accepts a request whole or rejects it, as the stock otlp
# receiver does. A kafka exporter acknowledges only what the broker stored.

service:
  extensions: [jaeger_storage, jaeger_query, healthcheckv2]
  pipelines:
    traces:
      receivers: [kafka]
      # No `batch` processor: batching happens in the connector's sending queue so
      # the Kafka offset stays coupled to the write result.
      processors: []
      exporters: [jaeger_storage_exporter]
    # Poison spans the storage rejected. The connector is this pipeline's source;
    # attach whichever exporter should keep them.
    traces/dead_letter:
      receivers: [jaeger_storage_exporter]
      processors: []
      exporters: [otlphttp/dead_letter]
  telemetry:
    resource:
      service.name: jaeger_ingester
    metrics:
      level: detailed
      readers:
        - pull:
            exporter:
              prometheus:
                host: 0.0.0.0
                # use different port to avoid conflict with the collector
                port: 8889
    logs:
      level: info

extensions:
  healthcheckv2:
    use_v2: true
    http:
      # use different port to avoid conflict with the collector
      endpoint: 0.0.0.0:14133

  jaeger_query:
    storage:
      traces: some_storage

  jaeger_storage:
    backends:
      some_storage:
        elasticsearch:
          server_urls:
            # The e2e tests point this at a fault-injecting proxy they control.
            - ${env:ES_SERVER_URL:-http://localhost:9200}
          # Write each batch with one blocking _bulk request (RFC 0007).
          write_mode: sync
          # fail, not drop: the writer reports the rejected spans to the connector,
          # which re-routes them. Under drop the writer would discard them itself
          # and nothing would reach the dead-letter pipeline.
          poison_pill_handling: fail
          bulk_processing:
            # Per-request byte cap of the synchronous writer, measured on the NDJSON
            # _bulk body, which is 1.3x to 3.6x the batch's protobuf size that
            # queue.batch.max_size below is measured in. Keep max_size at most half of
            # this so a batch is one _bulk request in the common case (see #PRNUM).
            max_bytes: 10000000
          indices:
            index_prefix: "jaeger-main"

receivers:
  kafka:
    brokers:
      - ${env:KAFKA_BROKER:-localhost:9092}
    traces:
      topics:
        - ${env:KAFKA_TOPIC:-jaeger-spans}
      encoding: ${env:KAFKA_ENCODING:-otlp_proto}
    initial_offset: earliest
    # Commit an offset only after the spans it covers are durably written or
    # in the dead-letter pipeline.
    message_marking:
      after: true
      on_error: false

processors:

connectors:
  jaeger_storage_exporter:
    trace_storage: some_storage
    # Same retry and queue settings as jaeger_storage_exporter in
    # config-kafka-ingester-sync.yaml; see the comments there.
    retry_on_failure:
      enabled: true
      initial_interval: 1s
      max_interval: 30s
      max_elapsed_time: 0
    queue:
      wait_for_result: true
      # A full queue waits for room instead of failing the record: the failure
      # would otherwise reach the receiver before any retry and pause the partition.
      block_on_overflow: true
      sizer: bytes
      num_consumers: 1
      queue_size: 104857600 # 100 MiB of buffered spans
      batch:
        sizer: bytes
        flush_timeout: 200ms
        # min_size must be positive: at 0 the batcher flushes every record as it
        # arrives and merges nothing. Below 1 MiB the batch waits for flush_timeout.
        min_size: 1048576
        max_size: 4194304 # 4 MiB, at most half of bulk_processing.max_bytes above

exporters:
  otlphttp/dead_letter:
    # The endpoint has no default on purpose: the obvious local one, port 4318, is
    # the OTLP receiver of config-kafka-collector.yaml, which would feed every
    # poison span back into the same Kafka topic in an endless loop. An unset
    # variable leaves the endpoint empty, which fails the exporter's configuration
    # validation before anything starts.
    traces_endpoint: ${env:DEAD_LETTER_ENDPOINT}
    # The connector needs the sink's verdict before it advances the offset, so the
    # dead-letter exporter must not acknowledge from a queue (see the header).
    sending_queue:
      enabled: false
    retry_on_failure:
      enabled: true
      initial_interval: 1s
      max_interval: 10s
      max_elapsed_time: 1m
