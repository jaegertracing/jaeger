service:
  extensions: [jaeger_storage, jaeger_query, healthcheckv2]
  pipelines:
    traces:
      receivers: [kafka]
      processors: []
      exporters: [jaeger_storage_exporter]
  telemetry:
    resource:
      service.name: jaeger
    metrics:
      level: detailed
      readers:
        - pull:
            exporter:
              prometheus:
                host: 0.0.0.0
                # use different port to avoid conflict with collector
                port: 8889
    logs:
      level: info

extensions:
  healthcheckv2:
    use_v2: true
    http:
      # use different port to avoid conflict with collector
      endpoint: 0.0.0.0:14133

  jaeger_query:
    storage:
      traces: some_storage

  jaeger_storage:
    backends:
      some_storage:
        memory:
          max_traces: 100000

receivers:
  kafka:
    brokers:
      - localhost:9092
    traces:
      topics:
        - ${env:KAFKA_TOPIC:-jaeger-spans}
      encoding: ${env:KAFKA_ENCODING:-otlp_proto}
    initial_offset: earliest

processors:

exporters:
  jaeger_storage_exporter:
    trace_storage: some_storage
    queue:
      enabled: true
      sizer: requests
      num_consumers: 1
      queue_size: 8192
      block_on_overflow: true
      wait_for_result: false
      batch:
        enabled: true
        sizer: items
        min_size: 8192
        max_size: 0
        flush_timeout: 200ms
