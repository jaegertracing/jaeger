service:
  extensions: [jaeger_storage, jaeger_query, healthcheckv2]
  pipelines:
    traces:
      receivers: [otlp]
      processors: []
      exporters: [jaeger_storage_exporter]
  telemetry:
    resource:
      service.name: jaeger
    metrics:
      level: detailed
      readers:
        - pull:
            exporter:
              prometheus:
                host: 0.0.0.0
                port: 8888
    logs:
      level: debug
    # TODO Initialize telemetry tracer once OTEL released new feature.
    # https://github.com/open-telemetry/opentelemetry-collector/issues/10663

extensions:
  healthcheckv2:
    use_v2: true
    http:

  jaeger_query:
    storage:
      traces: some-storage
      metrics: some-metrics
    ui:
      config_file: ./cmd/jaeger/config-ui.json
  jaeger_storage:
    backends:
      some-storage:
        clickhouse:
          addresses:
            - localhost:9000
          database: jaeger
          auth:
            basic:
              username: default
              password: password
          create_schema: true
          table_engine:
            merge_tree: {}
    metric_backends:
      some-metrics:
        clickhouse:
          addresses:
            - localhost:9000
          database: jaeger
          auth:
            basic:
              username: default
              password: password

receivers:
  otlp:
    protocols:
      grpc:
      http:

processors:

exporters:
  jaeger_storage_exporter:
    trace_storage: some-storage
    queue:
      enabled: true
      sizer: requests
      num_consumers: 1
      queue_size: 8192
      block_on_overflow: true
      wait_for_result: false
      batch:
        enabled: true
        sizer: items
        min_size: 8192
        max_size: 0
        flush_timeout: 200ms
