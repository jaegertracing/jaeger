#
# This test needs somewhere to store traces, so it reuses the OpenSearch service the
# repository already defines for its own e2e runs. Including that file rather than
# restating it keeps the image version and settings in one place.
#
# It has to be OpenSearch rather than memory storage, because Elasticsearch and
# OpenSearch are the only backends that declare filter capabilities today. That makes
# them the only ones that evaluate a structured filter, instead of having it
# down-converted to the legacy predicate fields.
#
# Jaeger is deliberately absent here. run.sh starts it from source against
# cmd/jaeger/config-opensearch.yaml, so that the test exercises the working tree
# rather than a published image.
include:
  - ../../../docker-compose/opensearch/v3/docker-compose.yml
