# This httpd configuration serves the mcp-proxy container of docker-compose.yml.
# It forwards every request to Jaeger and logs the request line, the status,
# and the headers run.sh looks for.
ServerRoot "/usr/local/apache2"
ServerName mcp-proxy
Listen 80
LoadModule mpm_event_module modules/mod_mpm_event.so
LoadModule authz_core_module modules/mod_authz_core.so
LoadModule log_config_module modules/mod_log_config.so
LoadModule proxy_module modules/mod_proxy.so
LoadModule proxy_http_module modules/mod_proxy_http.so
LoadModule unixd_module modules/mod_unixd.so
User daemon
Group daemon
ErrorLog /proc/self/fd/2
LogFormat "%m %U -> %>s turn=\"%{X-Jaeger-Turn-Token}i\" user=\"%{X-User}i\" auth=\"%{Authorization}i\" unlisted=\"%{X-Unlisted}i\" accept=\"%{Accept}i\" proto=\"%{MCP-Protocol-Version}i\" sid=\"%{Mcp-Session-Id}i\"" headers
CustomLog /proc/self/fd/1 headers
ProxyPreserveHost On
ProxyPass / http://jaeger:16686/ flushpackets=on
ProxyPassReverse / http://jaeger:16686/
