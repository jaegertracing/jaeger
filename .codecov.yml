codecov:
  notify:
    require_ci_to_pass: yes
    # Codecov posts nothing — not even the required codecov/* checks — until this many
    # uploads arrive, so the report it posts is complete. Keep it equal to the number
    # of jobs calling upload-codecov, each of which must cover packages not `ignore`-ed.
    after_n_builds: 12
  strict_yaml_branch: main  # only use the latest copy on the main branch

ignore:
  - "**/*.pb.go"
  - "**/mocks/*"
  - "proto-gen/*/*"
  - "thrift-gen/*/*"
  - "**/main.go"
  - "examples/hotrod"
  - "internal/storage/integration"
  - "cmd/jaeger/internal/integration"
  - "internal/tools"
  - "monitoring/jaeger-mixin/generate"

coverage:
  precision: 2
  round: down
  range: "95...100"
  status:
    project:
      default:
        enabled: yes
        target: 95%
    patch:
      default:
        enabled: yes
        target: 95%
