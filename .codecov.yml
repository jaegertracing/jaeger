codecov:
  notify:
    require_ci_to_pass: yes
    # Number of coverage uploads to wait for before notifying, so the status checks
    # and PR comment reflect a complete report rather than whichever uploads landed
    # first. Codecov withholds *all* notifications until this many arrive, so a value
    # above the number of uploads that carry coverage blocks every PR silently.
    # Keep it equal to the number of jobs calling .github/actions/upload-codecov,
    # each of which must upload a profile covering packages `ignore` does not exclude.
    after_n_builds: 12
  strict_yaml_branch: main  # only use the latest copy on the main branch

ignore:
  - "**/*.pb.go"
  - "**/mocks/*"
  - "proto-gen/*/*"
  - "thrift-gen/*/*"
  - "**/main.go"
  - "examples/hotrod"
  - "internal/storage/integration"
  - "cmd/jaeger/internal/integration"
  - "internal/tools"
  - "monitoring/jaeger-mixin/generate"

coverage:
  precision: 2
  round: down
  range: "95...100"
  status:
    project:
      default:
        enabled: yes
        target: 95%
    patch:
      default:
        enabled: yes
        target: 95%
