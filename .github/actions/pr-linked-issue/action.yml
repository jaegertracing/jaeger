name: 'PR Linked Issue'
description: >-
  Require that a pull request from an outside contributor is linked to an open
  help wanted issue, by labelling and commenting on the pull requests that are not.

inputs:
  token:
    description: >-
      Token used to label and comment. Needs issues:write and pull-requests:write,
      so pass the workflow token from a job that declares those permissions.
    required: true
  pull-request-number:
    description: 'Pull request to check. Every open pull request is checked when it is empty.'
    required: false
    default: ''
  dry-run:
    description: 'Report which pull requests violate the policy without writing anything.'
    required: false
    default: 'false'

runs:
  using: composite
  steps:
    - uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9
      env:
        # Inputs pass through the environment rather than being interpolated into the script
        # body, so a value from a workflow input cannot inject JavaScript.
        LINKED_ISSUE_PR_NUMBER: ${{ inputs.pull-request-number }}
        LINKED_ISSUE_DRY_RUN: ${{ inputs.dry-run }}
      with:
        github-token: ${{ inputs.token }}
        script: |
          const handler = require('${{ github.action_path }}/pr-linked-issue.js')
          await handler({
            github,
            core,
            owner: context.repo.owner,
            repo: context.repo.repo,
            pullRequestNumber: process.env.LINKED_ISSUE_PR_NUMBER,
            dryRun: process.env.LINKED_ISSUE_DRY_RUN === 'true'
          })
