name: 'Setup Node.js'
description: 'Setup Node.js and pnpm as required by jaeger-ui repo. Must be called after checkout with submodules.'
runs:
  using: "composite"
  steps:
    # Pin Node to major 24 so Corepack stays available. jaeger-ui engines allow
    # >=24.16.0, which would otherwise let setup-node resolve Node 25+ where
    # Corepack is no longer bundled.
    - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
      with:
        node-version: '24'
        package-manager-cache: false

    # Provision the pnpm version pinned in jaeger-ui/package.json via Corepack
    # instead of pnpm/action-setup. The action's installed wrapper is currently
    # failing to execute on ubuntu-latest during binary-size-check.
    - name: Enable pnpm via Corepack
      shell: bash
      run: |
        corepack enable pnpm
        corepack install --global "$(node -p 'require("./jaeger-ui/package.json").packageManager')"

    - name: Print node and pnpm versions
      shell: bash
      run: node --version && pnpm --version
