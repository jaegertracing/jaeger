name: 'Setup Go'
description: 'Setup Go toolchain with module cache keyed on both go.sum files'
runs:
  using: "composite"
  steps:
    - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
      with:
        # This is the only place CI names a Go version;
        # scripts/lint/check-go-version.sh keeps it in sync with go.mod.
        go-version: 1.27.x
        cache-dependency-path: |
          ./go.sum
          ./internal/tools/go.sum
    - name: Download Go module dependencies
      shell: bash
      # proxy.golang.org and sum.golang.org drop streams often enough to fail an
      # unrelated job, and every CI job uses this action.
      run: |
        download() {
          for attempt in 1 2 3; do
            if go mod download; then
              return 0
            fi
            if [ "$attempt" -lt 3 ]; then
              echo "::warning::go mod download in $PWD failed (attempt $attempt of 3); retrying"
              sleep $((attempt * 10))
            fi
          done
          echo "::error::go mod download in $PWD failed after 3 attempts"
          return 1
        }
        download
        cd internal/tools && download
