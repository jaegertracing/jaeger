name: Lint Checks

on:
  workflow_call:

# See https://github.com/ossf/scorecard/blob/main/docs/checks.md#token-permissions
permissions:  # added using https://github.com/step-security/secure-workflows
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
    - uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2.21.0
      with:
        egress-policy: audit # TODO: change to 'egress-policy: block' after a couple of runs

    - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

    - uses: ./.github/actions/setup-go

    - name: Print Jaeger version for no reason
      run: make echo-version

    - run: make install-test-tools

    - run: make lint

  pull-request-preconditions:
    runs-on: ubuntu-latest
    steps:
    - uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2.21.0
      with:
        egress-policy: audit # TODO: change to 'egress-policy: block' after a couple of runs

    - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

    - uses: ./.github/actions/block-pr-from-main-branch

    - run: |
        git fetch origin main
        make lint-nocommit

  dco-check:
    runs-on: ubuntu-latest
    steps:
    - uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2.21.0
      with:
        egress-policy: audit # TODO: change to 'egress-policy: block' after a couple of runs

    - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

    - name: Set up Python 3.x for DCO check
      uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
      with:
        python-version: '3.x'

    - name: Run DCO check
      # Sign-offs are enforced before the merge, so only the pull_request event matters:
      # dco_check.py rejects the merge_group event outright, and on a push to main it
      # inspects GitHub's squash commit, which GitHub authors as the PR author while the
      # Signed-off-by trailer names the author of the commits that were squashed.
      if: ${{ github.event.pull_request.user.login != 'dependabot' && github.event_name != 'merge_group' && github.event_name != 'push' }}
      run: python3 scripts/lint/dco_check.py -b main -v --exclude-pattern '@users\.noreply\.github\.com'
      env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  idl-version-check:
    runs-on: ubuntu-latest
    steps:
    - uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2.21.0
      with:
        egress-policy: audit # TODO: change to 'egress-policy: block' after couple of runs

    - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      with:
        submodules: recursive
        fetch-tags: true

    - name: check jaeger-idl versions across git submodule and go.mod dependency
      run: make lint-jaeger-idl-versions

  generated-files-check:
    runs-on: ubuntu-latest
    steps:
    - uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2.21.0
      with:
        egress-policy: audit # TODO: change to 'egress-policy: block' after couple of runs

    - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      with:
        submodules: recursive

    - uses: ./.github/actions/setup-go

    # `make proto` generates the Python SDK's stubs alongside the Go ones, and drives
    # protoc from that package's uv environment, so this job needs uv to run it. uv
    # fetches its own interpreter, so no Python setup step is needed.
    - name: Install uv
      uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
      with:
        version: "0.12.7"

    - name: Verify Protobuf types are up to date
      run: make proto && { if git status --porcelain | grep '??'; then exit 1; else git diff --name-status --exit-code; fi }

    - name: Verify Mockery types are up to date
      run: make generate-mocks && { if git status --porcelain | grep '??'; then exit 1; else git diff --name-status --exit-code; fi }

    - name: Verify Grafana dashboard JSON is in sync with Go generator
      run: make lint-monitoring

  lint-shell-scripts:
    runs-on: ubuntu-latest

    steps:
    - uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2.21.0
      with:
        egress-policy: audit

    - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

    - run: sudo apt-get install shellcheck

    - run: shellcheck scripts/**/*.sh

    - name: Install shunit2 for shell unit tests
      uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      with:
        repository: kward/shunit2
        path: .tools/shunit2

    - name: Install Helm
      uses: azure/setup-helm@dda3372f752e03dde6b3237bc9431cdc2f7a02a2 # v5

    - name: Run unit tests for scripts
      run: |
        SHUNIT2=.tools/shunit2 bash scripts/utils/run-tests.sh

    - name: Run Python unit tests for e2e scripts
      run: |
        python3 -m pip install --require-hashes --no-deps --only-binary :all: -r .github/requirements/ci-requirements.txt
        python3 -m unittest discover -s scripts/e2e -p '*_test.py' -v

  binary-size-check:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # Reading the PR's labels is what lets a maintainer waive the size gate.
      pull-requests: read
    steps:
    - uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2.21.0
      with:
        egress-policy: audit

    - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      with:
        submodules: true

    - uses: ./.github/actions/setup-go

    - name: Setup Node.js version
      uses: ./.github/actions/setup-node.js

    - name: Build jaeger binary
      run: make build-jaeger

    - name: Calculate jaeger binary size
      run: |
        TOTAL_SIZE=$(du -sb ./cmd/jaeger/jaeger-linux-amd64 | cut -f1)
        echo "$TOTAL_SIZE" > ./new_jaeger_binary_size.txt
        echo "Total binary size: $TOTAL_SIZE bytes"

    - name: Restore previous binary size
      id: cache-binary-size
      uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9      # v6.1.0
      with:
        path: ./jaeger_binary_size.txt
        key: jaeger_binary_size
        restore-keys: |
          jaeger_binary_size

    - name: Compare `jaeger` binary sizes
      if: ${{ (steps.cache-binary-size.outputs.cache-matched-key != '') && ((github.event_name != 'push') || (github.ref != 'refs/heads/main')) }}
      env:
        GH_TOKEN: ${{ github.token }}
        # Empty on merge_group runs, which are not attached to a pull request.
        PR_NUMBER: ${{ github.event.pull_request.number }}
        WAIVER_LABEL: accept-binary-size-increase
      run: |
        set -euf -o pipefail
        OLD_BINARY_SIZE=$(cat ./jaeger_binary_size.txt)
        NEW_BINARY_SIZE=$(cat ./new_jaeger_binary_size.txt)
        printf "Previous binary size: %'d bytes\n" $OLD_BINARY_SIZE
        printf "New binary size:      %'d bytes\n" $NEW_BINARY_SIZE

        PERCENTAGE_CHANGE=$(echo "scale=2; ($NEW_BINARY_SIZE - $OLD_BINARY_SIZE) * 100 / $OLD_BINARY_SIZE" | bc)
        if (( $(echo "$PERCENTAGE_CHANGE <= 2.0" | bc) == 1 )); then
          echo "✅ binary size change is within acceptable range ($PERCENTAGE_CHANGE%)"
          exit 0
        fi

        # An upstream upgrade can link in a large amount of code that Jaeger has no way to
        # avoid, and then no change to this PR can bring the binary back under the
        # threshold. A maintainer waives the gate for that PR by labeling it, and explains
        # the growth in the PR description.
        #
        # The label comes from the API rather than from github.event, because re-running
        # this job replays the payload the run started with, which cannot contain a label
        # added after the failure. Anything short of a definite match keeps the gate
        # closed, including a failed API call.
        WAIVED=false
        if [ -n "$PR_NUMBER" ]; then
          WAIVED=$(gh api "repos/$GITHUB_REPOSITORY/issues/$PR_NUMBER/labels" \
            --jq 'any(.name == $ENV.WAIVER_LABEL)' || echo false)
        fi

        if [ "$WAIVED" = "true" ]; then
          echo "::warning::binary size grew by $PERCENTAGE_CHANGE%, waived by the '$WAIVER_LABEL' label"
          exit 0
        fi

        # The merge queue cannot read labels, the same reason label-check.yml exempts it.
        # A PR reaches the queue only after review, which is where the waiver was granted.
        if [ "$GITHUB_EVENT_NAME" = "merge_group" ]; then
          echo "::warning::binary size grew by $PERCENTAGE_CHANGE%; not failing a merge_group run, which cannot read PR labels"
          exit 0
        fi

        echo "::error::binary size increased by more than 2% ($PERCENTAGE_CHANGE%). If the growth comes from upstream and this PR cannot avoid it, describe it in the PR description and add the '$WAIVER_LABEL' label."
        exit 1


    - name: Remove previous *_binary_*.txt
      run: |
        rm -rf ./jaeger_binary_size.txt
        mv ./new_jaeger_binary_size.txt ./jaeger_binary_size.txt

    - name: Save new jaeger binary size
      if: ${{ (github.event_name == 'push') && (github.ref == 'refs/heads/main') }}
      uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9     # v6.1.0
      with:
        path: ./jaeger_binary_size.txt
        key: jaeger_binary_size_${{ github.run_id }}

  validate-renovate-config:
    runs-on: ubuntu-latest
    steps:
    - uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2.21.0
      with:
        egress-policy: audit

    - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      with:
        submodules: false

    - name: validate renovate config
      run: |
        bash scripts/utils/retry.sh docker pull ghcr.io/renovatebot/renovate:latest
        docker run \
          -v $PWD/renovate.json:/usr/src/app/renovate.json \
          ghcr.io/renovatebot/renovate:latest \
          renovate-config-validator
