name: 'Close stale issues and PRs'

on:
  schedule:
    # Run every day at 1:30 AM UTC
    - cron: '30 1 * * *'
  workflow_dispatch:

permissions:
  # The stale action deletes its saved progress through the caches API. Without
  # this permission a saved entry stays forever, and the items in it are
  # skipped on every run.
  actions: write
  issues: write
  pull-requests: write

jobs:
  stale:
    runs-on: ubuntu-latest
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@ec9f2d5744a09debf3a187a3f4f675c53b671911
        with:
          egress-policy: audit

      - uses: actions/stale@28ca1036281a5e5922ead5184a1bbf96e5fc984e
        with:
          # Issues configuration
          days-before-issue-stale: 90
          days-before-issue-close: 14
          stale-issue-message: >
            This issue has been automatically marked as stale because it has not had
            recent activity. It will be closed if no further activity occurs.
            To keep it open either add a comment or the label `do-not-expire`.
          close-issue-message: >
            This issue has been automatically closed due to inactivity.
          stale-issue-label: 'stale'
          exempt-issue-labels: 'do-not-expire,help wanted'
          only-issue-labels: 'question'

          # Pull requests configuration
          days-before-pr-stale: 60
          days-before-pr-close: 14
          stale-pr-message: >
            This pull request has been automatically marked as stale because it has not had
            recent activity. It will be closed if no further activity occurs. You may re-open
            it if you need more time.
          close-pr-message: >
            This pull request has been automatically closed due to inactivity. You may re-open
            it if you need more time. We really appreciate your contribution and we are sorry
            that this has not been completed.
          stale-pr-label: 'stale'
          # The next step closes the pull requests that carry missing-issue.
          exempt-pr-labels: 'do-not-expire,missing-issue'

          # General configuration
          operations-per-run: 100
          remove-stale-when-updated: true

      # The Linked Issue workflow adds missing-issue and stale to a pull request
      # that has no linked help wanted issue. This step gives such a pull request
      # a shorter time to close.
      #
      # Both steps keep their progress in one cache entry of the stale action.
      # A step that runs out of operations makes the other step skip the items
      # it visited, until one of the steps completes a full pass.
      - uses: actions/stale@28ca1036281a5e5922ead5184a1bbf96e5fc984e
        with:
          # No issue carries missing-issue, so this step skips every issue.
          only-labels: 'missing-issue'
          # Activity on the pull request removes the stale label. Zero days puts
          # the label back on the next run for as long as missing-issue remains.
          days-before-pr-stale: 0
          days-before-pr-close: 7
          # The Linked Issue workflow has already explained the label.
          stale-pr-message: ''
          close-pr-message: >
            This pull request has been automatically closed because it is not linked
            to an open issue that carries the `help wanted` label. See
            https://github.com/jaegertracing/jaeger/blob/main/CONTRIBUTING_GUIDELINES.md#link-each-pull-request-to-an-issue.
            You may re-open it once it is linked to such an issue.
          stale-pr-label: 'stale'
          operations-per-run: 100
          remove-stale-when-updated: true
