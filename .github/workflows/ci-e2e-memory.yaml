# E2E integration tests for the in-memory storage backend (Jaeger v2).

name: CIT Memory

on:
  workflow_call:

# See https://github.com/ossf/scorecard/blob/main/docs/checks.md#token-permissions
permissions:  # added using https://github.com/step-security/secure-workflows
  contents: read
  actions: read  # gh run download, for the prebuilt binary artifact

jobs:
  memory-v2:
    runs-on: ubuntu-latest
    steps:
    - name: Harden Runner
      uses: step-security/harden-runner@a5ad31d6a139d249332a2605b85202e8c0b78450 # v2.19.1
      with:
        egress-policy: audit # TODO: change to 'egress-policy: block' after couple of runs

    - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

    - uses: ./.github/actions/setup-go
      with:
        go-version: 1.26.x

    # SPIKE (#9143): consume the once-per-run binary instead of building it here.
    # gh run download rather than actions/download-artifact: the fan-in workflow
    # already uses it, so there is no new action to pin.
    - name: Download the once-per-run instrumented binary
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        time gh run download "${{ github.run_id }}" \
          --repo "${{ github.repository }}" -n jaeger-e2e-binary -D cmd/jaeger
        # upload-artifact does not preserve the executable bit.
        chmod +x cmd/jaeger/jaeger
        ls -l cmd/jaeger/jaeger | awk '{printf "downloaded binary: %.0f MB\n", $5/1048576}'

    - name: Run Memory storage integration tests
      run: |
        STORAGE=memory_v2 PREBUILT_JAEGER=1 make jaeger-v2-storage-integration-test

    - uses: ./.github/actions/verify-metrics-snapshot
      with:
        snapshot: metrics_snapshot_memory
        artifact_key: metrics_snapshot_memory

    - name: Upload coverage to codecov
      uses: ./.github/actions/upload-codecov
      with:
        files: cover.out
        flag: memory_v2
