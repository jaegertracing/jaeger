# E2E integration tests for ClickHouse storage backend (Jaeger v2 only).

name: CIT ClickHouse

on:
  workflow_call:

# See https://github.com/ossf/scorecard/blob/main/docs/checks.md#token-permissions
permissions:  # added using https://github.com/step-security/secure-workflows
  contents: read

jobs:
  clickhouse:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        storage_test:
        - e2e
        - direct
        clickhouse_version:
        - lts-march
        - lts-august
        cluster_mode:
        - single-node
        - multi-node
    name: clickhouse ${{ matrix.storage_test }} ${{ matrix.clickhouse_version }} ${{ matrix.cluster_mode }}
    steps:
    - name: Harden Runner
      uses: step-security/harden-runner@46b06cea07f9e64621fdf066ba77ac6915163d43 # v2.22.3
      with:
        egress-policy: audit # TODO: change to 'egress-policy: block' after couple of runs

    - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

    - uses: ./.github/actions/setup-go

    - name: Run ClickHouse integration tests
      id: test-execution
      run: bash scripts/e2e/clickhouse.sh ${{ matrix.storage_test }} ${{ matrix.clickhouse_version }} ${{ matrix.cluster_mode }}

    - uses: ./.github/actions/verify-metrics-snapshot
      if: matrix.storage_test == 'e2e' && matrix.cluster_mode == 'single-node'
      with:
        snapshot: metrics_snapshot_clickhouse
        artifact_key: metrics_snapshot_clickhouse_${{ matrix.clickhouse_version }}

    - name: Upload coverage to codecov
      uses: ./.github/actions/upload-codecov
      with:
        flag: clickhouse-${{ matrix.storage_test }}-${{ matrix.clickhouse_version }}-${{ matrix.cluster_mode }}


