name: AI Sidecar Gemini Tests

on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  gemini-sidecar:
    runs-on: ubuntu-latest
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2.21.0
        with:
          egress-policy: audit # TODO: change to 'egress-policy: block' after a couple of runs

      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: '3.14'

      - name: Install uv
        uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990 # v8.3.2
        with:
          version: "0.12.5"

      - name: Sync sidecar dependencies
        working-directory: scripts/ai-sidecar/gemini
        run: uv sync --frozen

      - name: Run Pyright
        working-directory: scripts/ai-sidecar/gemini
        run: uv run pyright ./

      - name: Run Gemini sidecar tests
        working-directory: scripts/ai-sidecar/gemini
        run: uv run pytest -q
