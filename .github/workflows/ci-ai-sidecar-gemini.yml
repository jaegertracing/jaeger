name: AI Sidecar Gemini Tests

on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  gemini-sidecar:
    runs-on: ubuntu-latest
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2.21.0
        with:
          egress-policy: audit # TODO: change to 'egress-policy: block' after a couple of runs

      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.14'

      - name: Install uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: "0.12.5"

      - name: Sync sidecar dependencies
        working-directory: scripts/ai-sidecar/gemini
        run: uv sync --frozen

      - name: Run Pyright
        working-directory: scripts/ai-sidecar/gemini
        run: uv run pyright ./

      - name: Run Gemini sidecar tests
        working-directory: scripts/ai-sidecar/gemini
        run: uv run pytest -q
