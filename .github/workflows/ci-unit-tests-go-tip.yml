name: Unit Tests on Go Tip

on:
  push:
    branches: [main]

  workflow_dispatch:

  # We normally don't want this workflow to run on PRs, only on main branch.
  # Unless the workflow file itself or the setup action is modified.
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/ci-unit-tests-go-tip.yml'
      - '.github/actions/setup-go-tip/**'

permissions:
  contents: read

jobs:
  unit-tests-go-tip:
    runs-on: ubuntu-latest
    steps:
    - name: Harden Runner
      uses: step-security/harden-runner@46b06cea07f9e64621fdf066ba77ac6915163d43 # v2.22.3
      with:
        egress-policy: audit # TODO: change to 'egress-policy: block' after couple of runs

    - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

    - name: Install Go Tip
      uses: ./.github/actions/setup-go-tip
      with:
        gh_token: ${{ secrets.GITHUB_TOKEN }}

    - name: Clean Go cache for gotip
      run: |
        go clean -cache
        go clean -modcache

    - name: Run unit tests
      run: make test-ci

