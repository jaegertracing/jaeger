name: PR Quota Manager

on:
  pull_request_target:  # Runs with write permissions even for fork PRs
    # Label events include the existing stale policy's stale/unstale transitions.
    types: [opened, edited, closed, reopened, synchronize, ready_for_review, converted_to_draft, labeled, unlabeled]
  schedule:
    # Sweep all open PRs so a removed issue link cannot leave another PR stale.
    - cron: '15 2 * * *'
  workflow_dispatch:
    inputs:
      username:
        description: 'GitHub username to process quota for'
        required: true
        type: string
      dryRun:
        description: 'Dry run mode - show actions without making changes'
        required: false
        type: boolean
        default: false

permissions:
  pull-requests: write
  issues: write

concurrency:
  # A PR can share an issue with PRs from other authors, so author-scoped
  # locking cannot prevent conflicting reconciliations.
  group: pr-policy-${{ github.repository }}
  cancel-in-progress: false

jobs:
  manage-quota:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          # The job only needs the default branch's copy of the composite action and
          # its script. Without an explicit ref, checkout resolves github.sha, which
          # on the closed event of a merged PR is that PR's merge commit, and
          # checkout v7 refuses it in a pull_request_target workflow as fork code.
          ref: ${{ github.event.repository.default_branch }}

      - name: Process PR Quota
        uses: ./.github/actions/pr-quota-manager
        with:
          # The default GITHUB_TOKEN suffices: the pull_request_target trigger runs in
          # the base repo context, so the job-level issues/pull-requests write
          # permissions above cover labelling and commenting even on fork PRs.
          token: ${{ github.token }}
          username: ${{ github.event.inputs.username }}
          dry-run: ${{ github.event.inputs.dryRun }}
          per-issue-limit: 'true'
