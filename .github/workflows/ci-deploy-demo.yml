name: Deploy Jaeger Demo to OKE

on:
  push:
    branches: [main]
    paths:
      - 'examples/oci/**'
      - 'examples/otel-demo/**'
      - 'scripts/demo/**'
      - '.github/workflows/ci-deploy-demo.yml'
  schedule:
    - cron: '0 13 * * *'  # Daily at 8:00 AM US Eastern Time (ET)
  workflow_dispatch:
    inputs:
      image_tag:
        description: 'Snapshot image tag for demo components. Defaults to the workflow SHA.'
        required: false
      jaeger_image_tag:
        description: 'Jaeger snapshot image tag override. Defaults to image_tag or the workflow SHA.'
        required: false
      hotrod_image_tag:
        description: 'HotROD snapshot image tag override. Defaults to image_tag or the workflow SHA.'
        required: false
      deploy_mode:
        description: 'Deployment mode. Defaults to upgrade; use clean only to reinstall the demo.'
        required: false
        default: upgrade
        type: choice
        options:
          - upgrade
          - clean
      demo_stack:
        description: 'Demo stack to deploy. Defaults to the original OCI demo.'
        required: false
        default: oci
        type: choice
        options:
          - oci
          - otel
          - all
      otel_deploy_scope:
        description: 'Component scope. monitoring applies to OCI; otel-demo and opensearch apply to OTel.'
        required: false
        default: jaeger
        type: choice
        options:
          - jaeger
          - otel-demo
          - opensearch
          - monitoring
          - all
      opensearch_recovery:
        description: 'OpenSearch recovery policy. Waive only for disposable data in an isolated upgrade.'
        required: false
        default: required
        type: choice
        options:
          - required
          - waive

permissions: read-all

concurrency:
  group: jaeger-otel-demo-opensearch-recovery
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy Jaeger to OKE Cluster
    runs-on: ubuntu-latest
    env:
      OCI_CLI_USER: ${{ secrets.OCI_CLI_USER }}
      OCI_CLI_TENANCY: ${{ secrets.OCI_CLI_TENANCY }}
      OCI_CLI_FINGERPRINT: ${{ secrets.OCI_CLI_FINGERPRINT }}
      OCI_CLI_KEY_CONTENT: ${{ secrets.OCI_CLI_KEY_CONTENT }}
      OCI_CLI_REGION: ${{ secrets.OCI_CLI_REGION }}
      JAEGER_DEMO_JAEGER_IMAGE_REPOSITORY: jaegertracing/jaeger-snapshot
      JAEGER_DEMO_HOTROD_IMAGE_REPOSITORY: jaegertracing/example-hotrod-snapshot
      JAEGER_DEMO_GOOSE_IMAGE_REPOSITORY: jaegertracing/jaeger-goose-snapshot
      JAEGER_DEMO_IMAGE_TAG: ${{ github.event.inputs.image_tag || github.sha }}
      JAEGER_DEMO_JAEGER_IMAGE_TAG: ${{ github.event.inputs.jaeger_image_tag || github.event.inputs.image_tag || github.sha }}
      JAEGER_DEMO_HOTROD_IMAGE_TAG: ${{ github.event.inputs.hotrod_image_tag || github.event.inputs.image_tag || github.sha }}
      JAEGER_DEMO_IMAGE_PULL_POLICY: Always
      JAEGER_DEMO_DEPLOY_MODE: ${{ github.event.inputs.deploy_mode || 'upgrade' }}
      JAEGER_DEMO_STACK: ${{ github.event.inputs.demo_stack || 'oci' }}
      JAEGER_OTEL_DEMO_DEPLOY_SCOPE: ${{ github.event.inputs.otel_deploy_scope || 'jaeger' }}
      JAEGER_OTEL_DEMO_OPENSEARCH_RECOVERY: ${{ github.event.inputs.opensearch_recovery || 'required' }}
      RUN_PUBLIC_SMOKE_TESTS: "true"
      MAIN_SHA: ${{ github.sha }}
      GITHUB_EVENT_NAME: ${{ github.event_name }}

    steps:
    - name: Validate OpenSearch recovery policy
      run: |
        case "${JAEGER_OTEL_DEMO_OPENSEARCH_RECOVERY}" in
          required)
            ;;
          waive)
            if [[ "${GITHUB_EVENT_NAME}" != "workflow_dispatch" ||
              "${GITHUB_REF}" != "refs/heads/main" ||
              "${JAEGER_DEMO_STACK}" != "otel" ||
              "${JAEGER_DEMO_DEPLOY_MODE}" != "upgrade" ||
              "${JAEGER_OTEL_DEMO_DEPLOY_SCOPE}" != "opensearch" ]]; then
              echo "OpenSearch recovery may be waived only by a manual isolated otel/upgrade/opensearch run from main" >&2
              exit 1
            fi
            ;;
          *)
            echo "Invalid OpenSearch recovery policy: ${JAEGER_OTEL_DEMO_OPENSEARCH_RECOVERY}" >&2
            exit 1
            ;;
        esac

    - name: Configure kubectl with OKE
      uses: oracle-actions/configure-kubectl-oke@77a733d79446dabe7bf0e58eb56197d33ce4dc58 # v1.5.0
      with:
        cluster: ${{ secrets.OKE_CLUSTER_OCID }}
        enablePrivateEndpoint: false

    - name: Install Helm
      uses: azure/setup-helm@dda3372f752e03dde6b3237bc9431cdc2f7a02a2 # v5

    - name: Checkout jaeger repository
      uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7

    - name: Reconcile demo components
      run: python3 scripts/demo/deploy.py

    - name: Send detailed Slack notification on failure
      if: failure()
      uses: rtCamp/action-slack-notify@33ca3be66c6f378fe1610fd1d5258632dbed5e58 # v2.4.0
      env:
        SLACK_WEBHOOK: ${{ secrets.SLACK_WEBHOOK_URL }}
        SLACK_CHANNEL: '#jaeger-operations'
        SLACK_COLOR: danger
        SLACK_USERNAME: 'Jaeger CI Bot'
        SLACK_ICON_EMOJI: ':warning:'
        SLACK_TITLE: '🚨 Jaeger OKE Deployment Failed'
        SLACK_MESSAGE: |
          *Repository:* ${{ github.repository }}
          *Workflow:* ${{ github.workflow }}
          *Run ID:* ${{ github.run_id }}
          *Trigger:* ${{ github.event_name }}
          *Actor:* ${{ github.actor }}

          <${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}|🔗 View Failed Run>
        SLACK_FOOTER: 'Jaeger CI/CD Pipeline'
