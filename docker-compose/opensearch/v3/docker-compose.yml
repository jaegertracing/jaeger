services:
  opensearch:
    image: opensearchproject/opensearch:3.8.0@sha256:bcc1797519726ceb6d651d4a3e60b7c30da91793914a8dfe75fd441d4f641509
    environment:
      - discovery.type=single-node
      - cluster.routing.allocation.disk.threshold_enabled=false
      # The security plugin is not installed at all, rather than installed and disabled.
      # Since OpenSearch 3.8 its audit logging runs even when the plugin itself is
      # disabled, and auditing every bulk request makes indexing unusably slow.
      - DISABLE_SECURITY_PLUGIN=true
      - http.host=0.0.0.0
      - transport.host=127.0.0.1
    ports:
      - "9200:9200"
