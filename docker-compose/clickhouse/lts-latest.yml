services:
  clickhouse:
    image: clickhouse/clickhouse-server:26.8.32@sha256:7dfd56d5b9a5d17eb308bf79641b52c70e93800268e9f2137cad942b5e0e40c1
    container_name: clickhouse
    environment:
      - CLICKHOUSE_USER=default
      - CLICKHOUSE_PASSWORD=password
      - CLICKHOUSE_DB=jaeger
    ports:
      - "8123:8123"
      - "9000:9000"
    volumes:
      - ./keeper.yaml:/etc/clickhouse-server/config.d/keeper.yaml:ro
    healthcheck:
      test: ["CMD", "clickhouse-client", "--query=SELECT 1"]
      interval: 10s
      timeout: 5s
      retries: 5
