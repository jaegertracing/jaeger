# The monthly-stable counterpart of the multi-node LTS compose file. This is the release line on
# which the unfiltered Distributed query plan from #9881 was observed.
services:
  clickhouse-keeper:
    image: clickhouse/clickhouse-server:26.8.32@sha256:7dfd56d5b9a5d17eb308bf79641b52c70e93800268e9f2137cad942b5e0e40c1
    container_name: clickhouse-keeper
    volumes:
      - ./keeper-multi-node.yaml:/etc/clickhouse-server/config.d/keeper.yaml:ro
    healthcheck:
      test: ["CMD", "clickhouse-keeper-client", "--host=localhost", "--port=9181", "--query=stat"]
      interval: 5s
      timeout: 3s
      retries: 10

  clickhouse-01:
    image: clickhouse/clickhouse-server:26.8.32@sha256:7dfd56d5b9a5d17eb308bf79641b52c70e93800268e9f2137cad942b5e0e40c1
    container_name: clickhouse-01
    depends_on:
      - clickhouse-keeper
    environment:
      - CLICKHOUSE_USER=default
      - CLICKHOUSE_PASSWORD=password
      - CLICKHOUSE_DB=jaeger
    ports:
      - "8123:8123"
      - "9000:9000"
    volumes:
      - ./cluster.yaml:/etc/clickhouse-server/config.d/cluster.yaml:ro
      - ./macros-01.yaml:/etc/clickhouse-server/config.d/macros.yaml:ro
    healthcheck:
      test: ["CMD", "clickhouse-client", "--query=SELECT 1"]
      interval: 10s
      timeout: 5s
      retries: 5

  clickhouse-02:
    image: clickhouse/clickhouse-server:26.8.32@sha256:7dfd56d5b9a5d17eb308bf79641b52c70e93800268e9f2137cad942b5e0e40c1
    container_name: clickhouse-02
    depends_on:
      - clickhouse-keeper
    environment:
      - CLICKHOUSE_USER=default
      - CLICKHOUSE_PASSWORD=password
      - CLICKHOUSE_DB=jaeger
    ports:
      - "8124:8123"
      - "9001:9000"
    volumes:
      - ./cluster.yaml:/etc/clickhouse-server/config.d/cluster.yaml:ro
      - ./macros-02.yaml:/etc/clickhouse-server/config.d/macros.yaml:ro
    healthcheck:
      test: ["CMD", "clickhouse-client", "--query=SELECT 1"]
      interval: 10s
      timeout: 5s
      retries: 5
